<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>hellmo.de — nichbar</title>
    <meta
      name="description"
      content="hellmo.de — Live album cover wallpaper wall powered by nichbar's most recent Last.fm listen, with GitHub profile info."
    />
    <link rel="canonical" href="https://hellmo.de/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hellmo.de/" />
    <meta property="og:title" content="hellmo.de — nichbar" />
    <meta
      property="og:description"
      content="Live Last.fm album cover wallpaper wall for nichbar."
    />
    <link
      id="dynamic-favicon"
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23fafafa' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fafafa'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="wallpaper-stage" class="wallpaper-stage is-drifting" aria-label="Live album cover wallpaper wall">
      <div id="ambient-backdrop" class="ambient-backdrop" aria-hidden="true"></div>
      <div id="wallpaper-grid-a" class="wallpaper-grid is-active" aria-hidden="true"></div>
      <div id="wallpaper-grid-b" class="wallpaper-grid" aria-hidden="true"></div>
      <div class="vignette-overlay" aria-hidden="true"></div>
    </main>

    <div id="hud-container" class="hud-container">
      <section class="hud-card hud-music" aria-label="Most recent Last.fm listen">
        <a
          id="hud-cover-link"
          class="hud-music__cover-wrap"
          href="https://www.last.fm/user/nichbar"
          target="_blank"
          rel="noopener noreferrer"
          title="View on Last.fm"
        >
          <img
            id="hud-cover"
            class="hud-music__cover"
            src=""
            alt="Most recent album cover"
            width="56"
            height="56"
          />
        </a>

        <div class="hud-music__body">
          <div class="hud-music__status">
            <span id="hud-status-dot" class="status-dot" aria-hidden="true"></span>
            <a
              id="hud-github-link"
              class="hud-inline-link hud-owner-link"
              href="https://www.github.com/nichbar"
              target="_blank"
              rel="noopener noreferrer"
              title="Nich on GitHub"
              >Nich</a
            >
            <span class="hud-sep" aria-hidden="true">·</span>
            <a
              id="hud-lastfm-link"
              class="hud-inline-link"
              href="https://www.last.fm/user/nichbar"
              target="_blank"
              rel="noopener noreferrer"
              title="Open Last.fm profile"
              ><span id="hud-status-label">LOADING</span></a
            >
          </div>
          <div id="hud-track" class="hud-music__track">Loading recent listen…</div>
          <div id="hud-meta" class="hud-music__meta">Fetching from Last.fm</div>
        </div>

        <div class="hud-controls" role="group" aria-label="Wallpaper controls" hidden>
          <button
            id="btn-tile-smaller"
            class="icon-btn"
            type="button"
            title="Smaller tiles"
            aria-label="Make wallpaper tiles smaller"
          >
            −
          </button>
          <button
            id="btn-tile-larger"
            class="icon-btn"
            type="button"
            title="Larger tiles"
            aria-label="Make wallpaper tiles larger"
          >
            +
          </button>
          <button
            id="btn-toggle-motion"
            class="icon-btn is-pressed"
            type="button"
            title="Toggle ambient motion"
            aria-label="Toggle ambient motion"
            aria-pressed="true"
          >
            ≈
          </button>
          <button
            id="btn-refresh"
            class="icon-btn"
            type="button"
            title="Refresh now"
            aria-label="Refresh Last.fm track"
          >
            ↻
          </button>
          <button
            id="btn-hide-hud"
            class="icon-btn"
            type="button"
            title="Hide HUD (press H to toggle)"
            aria-label="Hide corner HUD"
          >
            ◫
          </button>
        </div>
      </section>
    </div>

    <button
      id="hud-restore-btn"
      class="hud-restore-btn"
      type="button"
      hidden
      title="Show HUD (H)"
      aria-label="Show corner HUD"
    >
      hellmo.de · Show HUD
    </button>

    <script defer src="config.js"></script>
    <script defer src="app.js"></script>
  </body>
</html>
